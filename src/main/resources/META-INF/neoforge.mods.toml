modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/traelmyx/steam-engine-shaft-fix/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx"
logoFile = "assets/steam_shaft_fix/icon.png"
displayTest = "IGNORE_ALL_VERSION"
description = '''Steam engines stop breaking their shafts: idle engines keep their direction, and changes in boiler power no longer count as flicker (Create issue #3701).'''

[[mixins]]
config = "steam_shaft_fix.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "create"
type = "required"
versionRange = "[6.0.0,)"
ordering = "AFTER"
side = "BOTH"
